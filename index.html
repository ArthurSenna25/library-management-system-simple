<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Senna</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Library Senna</h1>
    <main>
      <section>
        <div id="form-content">
          <form id="form">
            <div>
              <label for="job-select">Selecione o Cargo</label>
              <select id="job-select">
                <option value=""></option>
                <option value="reader">Leitor</option>
                <option value="librarian">Bibliotecário</option>
              </select>
            </div>

            <div>
              <label for="name">Nome:</label>
              <input type="text" id="name" placeholder="Ex: Senna" required />
            </div>

            <div>
              <label for="cpf">CPF:</label>
              <input
                type="text"
                id="cpf"
                placeholder="Ex: 111.111.111-11"
                required
              />
            </div>

            <div id="reader-code-div" style="display: none">
              <label for="reader-code">Código do Leitor:</label>
              <input
                type="number"
                id="reader-code"
                placeholder="Ex: 1"
                required
              />
            </div>

            <div id="borrowed-book-div" style="display: none">
              <label for="borrowed-book">Livro Emprestado:</label>
              <input
                type="text"
                id="borrowed-book"
                placeholder="Ex: Harry Potter"
                required
              />
              <button id="add-borrowed-book-button" type="button">
                Adicionar
              </button>
            </div>

            <div id="employee-registration-div" style="display: none">
              <label for="employee-registration">Matrícula:</label>
              <input
                type="number"
                id="employee-registration"
                placeholder="Ex: 1"
                required
              />
            </div>

            <div id="shift-div" style="display: none">
              <label for="shift">Turno:</label>
              <input type="text" id="shift" placeholder="Ex: Manhã" required />
            </div>

            <div id="register-loan-div" style="display: none">
              <label for="register-loan">Registar Leitor:</label>
              <input
                type="text"
                id="register-loan"
                placeholder="Nome do Leitor"
                required
              />
              <button id="add-loan-reader-button" type="button">
                Registrar
              </button>
            </div>

            <button id="send-button" type="submit">Enviar</button>
          </form>
        </div>

        <div id="results-content">
          <button id="display-results-button" style="display: none">
            Exibir Informações
          </button>
          <div id="display-results"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
